name: Manual Docker Image CI

permissions:
  contents: read
  packages: write
  id-token: write

on:
  workflow_dispatch:
    inputs:
      php_version:
        description: 'PHP version to build (e.g. 7.4, 8.0, 8.5). Leave blank to use the Dockerfile default.'
        required: false
        type: string
        default: ''

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Resolve PHP version
      id: php
      run: |
        if [ -n "${{ inputs.php_version }}" ]; then
          VERSION="${{ inputs.php_version }}"
          echo "build_arg=PHP_VERSION=${VERSION}" >> "$GITHUB_OUTPUT"
        else
          VERSION=$(grep -oP '^ARG PHP_VERSION=\K.*' Dockerfile)
          echo "build_arg=" >> "$GITHUB_OUTPUT"
        fi
        echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

    - name: Docker Login
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Cache Docker layers
      uses: actions/cache@v6
      with:
        path: /tmp/.buildx-cache
        key: ${{ runner.os }}-buildx-${{ steps.php.outputs.version }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-buildx-${{ steps.php.outputs.version }}-
          ${{ runner.os }}-buildx-

    - name: Docker Metadata action
      id: docker_meta
      uses: docker/metadata-action@v6
      with:
        images: ghcr.io/${{ github.repository }}
        tags: |
            type=raw,value=${{ steps.php.outputs.version }}
            type=raw,value=${{ steps.php.outputs.version }}-{{sha}}
            type=ref,event=branch,suffix=-${{ steps.php.outputs.version }}

    - name: Build and push Docker images
      uses: docker/build-push-action@v7
      with:
        push: true
        build-args: ${{ steps.php.outputs.build_arg }}
        tags: ${{ steps.docker_meta.outputs.tags }}
        labels: ${{ steps.docker_meta.outputs.labels }}
        cache-from: type=local,src=/tmp/.buildx-cache
        cache-to: type=local,dest=/tmp/.buildx-cache
